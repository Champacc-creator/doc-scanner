<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>บันทึกเอกสาร</title>

    <!-- ใช้ฟอนต์ Prompt จาก Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

    <style>

        body {

            font-family: 'Prompt', sans-serif;

            background-color: #f4f7f6;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            margin: 0;

        }

        .container {

            background: white;

            padding: 2rem;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.1);

            width: 90%;

            max-width: 400px;

        }

        h2 { text-align: center; color: #333; margin-bottom: 1.5rem; }

        .form-group { margin-bottom: 1.2rem; }

        label { display: block; margin-bottom: 0.5rem; color: #666; font-weight: 400; }

        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            box-sizing: border-box; /* สำคัญมาก */

            font-size: 16px;

        }

        button {

            width: 100%;

            padding: 14px;

            background-color: #27ae60;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 18px;

            cursor: pointer;

            transition: background 0.3s;

        }

        button:hover { background-color: #219150; }

        button:disabled { background-color: #bdc3c7; }

    </style>

</head>

<body>


<div class="container">

    <h2>บันทึกข้อมูลเอกสาร</h2>

    

    <div class="form-group">

        <label>รหัสเอกสาร</label>

        <input type="text" id="docCode" placeholder="เช่น DOC-001">

    </div>

    

    <div class="form-group">

        <label>ชื่อผู้รับ</label>

        <input type="text" id="receivedBy" placeholder="ใส่ชื่อผู้รับ">

    </div>

    

    <button id="saveBtn" onclick="saveData()">บันทึกข้อมูล</button>

</div>


<script src="app.js"></script>

</body>

</html>
